services:
  api:
    build: ./api
    ports: ["5000:5000"]
    environment:
      DB_HOST: db
      DB_NAME: predictions
      DB_USER: postgres
      DB_PASSWORD: example
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: predictions
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  frontend:
    image: nginx:alpine
    ports: ["8081:80"]
    volumes: ["./frontend:/usr/share/nginx/html"]
    depends_on: [api]
volumes:
  pgdata: